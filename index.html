ialPlaceholders ?? false) && !realT.length;\n    const testimonials = realT.length ? realT : placeholders ? [1, 2, 3].map(n => ({ name: 'Cliente ' + n, text: 'Espaço reservado para uma avaliação real e autorizada de cliente.', hasStars: false, stars: '', starsLabel: '', bg: 'transparent', border: '2px dashed #C9D1DE', fg: '#6B7280' })) : [];\n\n    const toNum = v => parseFloat((v ?? '').toString().replace(/[^\\d,.]/g, '').replace(/\\./g, '').replace(',', '.'));\n    const orig = toNum(p.originalPrice ?? '39,90'), price = 17.90;\n    const end = clean(p.promoEndsAt ?? '2026-10-18'), today = new Date(), pad = n => String(n).padStart(2, '0');\n    const todayStr = today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate());\n    const hasPromo = orig > price && !!end && todayStr <= end;\n    const urgencyLabel = end === todayStr ? 'SOMENTE HOJE' : 'VÁLIDA ATÉ ' + end.slice(8, 10) + '/' + end.slice(5, 7);\n\n    const bumpPrice = clean(p.bumpPrice ?? 'R$ 9,90') || 'À parte';\n    const email = clean(p.supportEmail), terms = clean(p.termsUrl), privacy = clean(p.privacyUrl);\n    const footLinks = [];\n    if (privacy) footLinks.push({ label: 'Política de Privacidade', href: privacy });\n    if (terms) footLinks.push({ label: 'Termos de Uso', href: terms });\n    if (email) footLinks.push({ label: 'Suporte', href: email.includes('@') && !email.startsWith('http') ? 'mailto:' + email : email });\n\n    const faqData = [\n      ['Como funciona o Currículo Pro?', 'É uma ferramenta online: você escolhe um modelo, preenche suas informações — dados pessoais, formação, experiências e habilidades — e pode usar exemplos prontos de textos e a ajuda da inteligência artificial para escrever. Depois, baixa o currículo em PDF. Ele fica salvo para você editar quando precisar.'],\n      ['Preciso ter experiência profissional para utilizar o produto?', 'Não. Você pode organizar formação, cursos, projetos, trabalhos voluntários e habilidades. Quem já tem experiência também pode usar para atualizar o currículo.'],\n      ['Como recebo acesso após a compra?', 'Assim que o pagamento é confirmado, a Cakto envia automaticamente um e-mail com o link de acesso ao Currículo Pro. No cartão, a liberação depende da aprovação da operadora. Se não encontrar o e-mail, confira a caixa de spam.'],\n      ['O pagamento é único ou recorrente?', 'Pagamento único de R$ 17,90, sem mensalidade e sem cobrança recorrente. Você pode pagar com Pix ou cartão de crédito, com opção de parcelamento.'],\n      ['E se eu não gostar do produto?', 'Você tem 7 dias a partir da compra para solicitar o reembolso. ' + (email ? 'Basta entrar em contato pelo e-mail ' + email + ' dentro desse prazo, informando o e-mail usado na compra.' : 'Basta fazer o pedido dentro desse prazo pelo canal de suporte indicado no e-mail de confirmação da compra.')]\n    ];\n\n    const checkout = this.checkoutUrl();\n    const heroImage = clean(p.heroImage);\n    const stickyOn = (p.showMobileStickyCta ?? true) && isPhone;\n    return {\n      showNav: s.w >= 900,\n      heroCtaRef: this.heroCtaRef, offerRef: this.offerRef, trackRef: this.trackRef,\n      hasHeroImage: !!heroImage, noHeroImage: !heroImage,\n      heroImg: heroImage ? React.createElement('img', { src: heroImage, alt: 'Captura de tela do Currículo Pro', loading: 'eager', decoding: 'async', style: { display: 'block', width: '100%', height: 'auto' } }) : null,\n      heroCaption: heroImage ? 'Captura de tela do Currículo Pro.' : 'Exemplo ilustrativo de currículo · dados fictícios.',\n      heroPad: isPhone ? '24px 22px 0' : 'clamp(28px,4vw,48px)',\n      heroH: isPhone ? '360px' : 'auto',\n      bumpNote: 'Eles são opcionais e oferecidos à parte no checkout.',\n      bumpBox: 'Os 3 materiais aparecem no checkout como adicional opcional (' + bumpPrice + '). Você só paga se escolher incluir.',\n      bumpPrice,\n      included: ['Acesso à ferramenta online Currículo Pro', 'Modelos de currículo', 'Edição das informações', 'Ajuda de inteligência artificial e exemplos de textos', 'Download em PDF', 'Currículo salvo para editar depois'],\n      hasPromo, hasUrgency: hasPromo, urgencyLabel,\n      originalPrice: hasPromo ? orig.toFixed(2).replace('.', ',') : '',\n      discountLabel: hasPromo ? Math.floor((1 - price / orig) * 100) + '% OFF' : '',\n      checkoutHref: checkout || '#oferta',\n      buying: s.buying, notBuying: !s.buying, buyAria: s.buying ? 'true' : 'false',\n      onBuy: e => {\n        if (!checkout) return;\n        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;\n        e.preventDefault();\n        if (this.state.buying) return;\n        try { window.fbq && window.fbq('track', 'InitiateCheckout', { value: 17.90, currency: 'BRL', content_name: 'Currículo Pro' }); } catch (_) {}\n        this.setState({ buying: true });\n        this.bt = setTimeout(() => this.setState({ buying: false }), 6000);\n        setTimeout(() => { window.location.href = checkout; }, 150);\n      },\n      convs: [1, 2, 3].map((n, i) => ({ op: (s.cIdx || 0) === i ? '1' : '0', img: React.createElement('img', { src: 'assets/conversa-' + n + '.png', alt: (s.cIdx || 0) === i ? 'Exemplo ilustrativo ' + n + ' de conversa sobre o Currículo Pro (não é depoimento real)' : '', 'aria-hidden': (s.cIdx || 0) === i ? undefined : 'true', loading: i === 0 ? 'eager' : 'lazy', decoding: 'async', draggable: false, style: { display: 'block', width: '100%', height: '100%', objectFit: 'cover' } }) })),\n      convDots: [0, 1, 2].map(i => ({ active: (s.cIdx || 0) === i, label: 'Mostrar exemplo ' + (i + 1), w: (s.cIdx || 0) === i ? '28px' : '10px', bg: (s.cIdx || 0) === i ? '#60A5FA' : 'rgba(255,255,255,.3)', go: () => { this.convPause = Date.now() + 9000; this.setState({ cIdx: i }); } })),\n      convPos: ((s.cIdx || 0) + 1) + ' DE 3',\n      convHoverOn: () => { this.convHover = true; }, convHoverOff: () => { this.convHover = false; },\n      resumes,\n      autoCols: perView === 1 ? 'min(84vw,360px)
