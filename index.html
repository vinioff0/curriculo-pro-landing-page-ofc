3EB;color:#fff;font-weight:700;font-size:16px;letter-spacing:.03em;box-shadow:0 10px 24px -12px rgba(37,99,235,.8);transition:background .15s\" style-hover=\"background:#1D4ED8;color:#fff\">\n        <sc-if value=\"{{ buying }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:cpspin .7s linear infinite\"><\u002Fspan>Abrindo o checkout…<\u002Fsc-if>\n        <sc-if value=\"{{ notBuying }}\" hint-placeholder-val=\"{{ true }}\">QUERO CRIAR MEU CURRÍCULO<\u002Fsc-if>\n      <\u002Fa>\n      <p style=\"margin:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#5B616E\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>Pedido concluído no checkout seguro da Cakto<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"faq-title\" style=\"padding:clamp(56px,7vw,96px) 0;background:#F3F5F9\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(20px,5vw,80px);align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:380px\">\n      <h2 id=\"faq-title\" style=\"margin:0;font-size:clamp(30px,3.6vw,44px);line-height:1.04;letter-spacing:-.04em;font-weight:700;color:#111318\">Perguntas frequentes<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#4B515C\">Tire suas dúvidas antes de começar.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E3E6EB;border-radius:16px;padding:4px 24px\">\n      <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"5\">\n        <div style=\"border-bottom:{{ q.border }}\">\n          <h3 style=\"margin:0\">\n            <button type=\"button\" sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.open }}\" aria-controls=\"{{ q.pid }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;background:none;border:0;cursor:pointer;text-align:left;font:600 16.5px/1.4 'Schibsted Grotesk',system-ui,sans-serif;color:#111318\">\n              <span>{{ q.q }}<\u002Fspan>\n              <span aria-hidden=\"true\" style=\"flex:none;width:30px;height:30px;border-radius:50%;border:1px solid {{ q.ring }};background:{{ q.iconBg }};display:grid;place-items:center;transform:rotate({{ q.rot }});transition:transform .2s,background .2s\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ q.iconFg }}\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fh3>\n          <sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p id=\"{{ q.pid }}\" style=\"margin:0;padding:0 46px 22px 0;font-size:15.5px;line-height:1.6;color:#4B515C;animation:cpup .2s ease both\">{{ q.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"background:#FFFFFF;border-top:1px solid #E7E8EB;padding:28px 0 {{ footPad }}\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;font-size:13.5px;color:#5B616E\">\n    <span style=\"display:flex;align-items:center;gap:8px;font-weight:600;color:#111318\"><span style=\"width:20px;height:20px;border-radius:6px;background:#2563EB\"><\u002Fspan>Currículo Pro<\u002Fspan>\n    <nav aria-label=\"Links institucionais\" style=\"display:flex;flex-wrap:wrap;gap:20px\">\n      <sc-for list=\"{{ footLinks }}\" as=\"l\" hint-placeholder-count=\"0\"><a href=\"{{ l.href }}\" style=\"color:#4B515C\" style-hover=\"color:#111318\">{{ l.label }}<\u002Fa><\u002Fsc-for>\n      <span>© {{ year }} Currículo Pro<\u002Fspan>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#FFFFFF;border-top:1px solid #E7E8EB;box-shadow:0 -10px 24px -18px rgba(17,19,24,.4);animation:cpup .2s ease both\">\n    <a href=\"{{ checkoutHref }}\" sc-camel-on-click=\"{{ onBuy }}\" style=\"max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;padding:0 18px;border-radius:11px;background:#2563EB;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap\" style-active=\"background:#1D4ED8\"><span>QUERO CRIAR MEU CURRÍCULO<\u002Fspan><span style=\"font-weight:500\">R$ 17,90<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;checkoutUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://pay.cakto.com.br/f9nsw9y_1208445&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Checkout&quot;},&quot;feedbackImages&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Carrossel&quot;},&quot;showMobileStickyCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Mobile&quot;},&quot;supportEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Rodapé&quot;},&quot;termsUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Rodapé&quot;},&quot;privacyUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Rodapé&quot;}}\">\nclass Component extends DCLogic {\n  state = { w: 1280, idx: 0, open: 0, buying: false, heroVis: true, offerVis: false, qs: '' };\n  heroCtaRef = React.createRef();\n  offerRef = React.createRef();\n  trackRef = React.createRef();\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    this.onResize();\n    window.addEventListener('resize', this.onResize, { passive: true });\n    try {\n      const src = new URLSearchParams(location.search), keep = new URLSearchParams();\n      src.forEach((v, k) => { if (/^(utm_|fbclid$|gclid$|src$|sck$|xcod$)/i.test(k)) keep.set(k, v); });\n      const qs = keep.toString();\n      if (qs) this.setState({ qs });\n    } catch (_) {}\n    this.carVis = true;\n    if ('IntersectionObserver' in window) {\n      this.io = new IntersectionObserver(es => es.forEach(e => {\n        if (e.target === this.heroCtaRef.current) this.setState({ heroVis: e.isIntersecting || e.boundingClientRect.top > 0 });\n        if (e.target === this.offerRef.current) this.setState({ offerVis: e.isIntersecting });\n        if (e.target === this.trackRef.current) this.carVis = e.isIntersecting;\n      }), { threshold: 0.05 });\n      [this.heroCtaRef, this.offerRef, this.trackRef].forEach(r => r.current && this.io.observe(r.current));\n    }\n    this.startCar();\n    this.onPageShow = () => this.setState({ buying: false });\n    window.addEventListener('pageshow', this.onPageShow);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('pageshow', this.onPageShow);\n    this.io && this.io.disconnect();\n    clearTimeout(this.bt); clearInterval(this.ct);\n  }\n  step() {\n    const t = this.trackRef.current, first = t && t.firstElementChild;\n    if (!first) return 1;\n    const gap = parseFloat(getComputedStyle(t).columnGap) || 0;\n    return first.getBoundingClientRect().width + gap;\n  }\n  atEnd() { const t = this.trackRef.current; return !t || t.scrollLeft + t.clientWidth >= t.scrollWidth - 4; }\n  go(i) {\n    const t = this.trackRef.current; if (!t) return;\n    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n    t.scrollTo({ left: Math.max(0, i) * this.step(), behavior: reduce ? 'auto' : 'smooth' });\n  }\n  startCar() {\n    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    clearInterval(this.ct);\n    this.ct = setInterval(() => {\n      if (this.carHover || document.hidden || !this.carVis || Date.now() < (this.carPauseUntil || 0)) return;\n      const t = this.trackRef.current; if (!t) return;\n      this.go(this.atEnd() ? 0 : Math.round(t.scrollLeft / this.step()) + 1);\n    }, 4000);\n  }\n  checkoutUrl() {\n    const base = (this.props.checkoutUrl ?? 'https://pay.cakto.com.br/f9nsw9y_1208445').toString().trim();\n    if (!base || !this.state.qs) return base;\n    return base + (base.includes('?') ? '&' : '?') + this.state.qs;\n  }\n  renderVals() {\n    const p = this.props, s = this.state;\n    const isPhone = s.w < 768, wide = s.w >= 1100;\n    const custom = (p.feedbackImages ?? '').toString().split(/[\\n,]+/).map(x => x.trim()).filter(Boolean);\n    const imgs = custom.length ? custom : [1, 2, 3, 4, 5].map(n => 'assets/exemplo-' + n + '.png');\n    const count = imgs.length, idx = Math.min(s.idx, count - 1);\n    const pause = () => { this.carPauseUntil = Date.now() + 8000; };\n    const faqData = [\n      ['Preciso ter experiência para usar o Currículo Pro?', 'Não. O Currículo Pro também é voltado para quem está preparando o primeiro currículo — você pode destacar formação, cursos, projetos e habilidades.'],\n      ['Preciso saber mexer em ferramentas de edição?', 'Não. A proposta do Currículo Pro é simplificar a criação: você preenche suas informações e elas ficam organizadas em um modelo com aparência profissional.'],\n      ['Quanto custa o Currículo Pro?', 'O produto principal custa R$ 17,90. Se houver algum item adicional opcional no checkout, ele aparece separado e só é incluído se você escolher.'],\n      ['Como faço para comprar?', 'Clique em qualquer botão “Quero criar meu currículo”. Você será levado ao checkout seguro da Cakto, onde revisa o pedido e conclui o pagamento.'],\n      ['O Currículo Pro garante uma vaga de emprego?', 'Não. O Currículo Pro ajuda você a organizar e apresentar suas informações de forma profissional. A contratação depende de cada processo seletivo.']\n    ];\n    const clean = v => (v ?? '').toString().trim();\n    const email = clean(p.supportEmail), terms = clean(p.termsUrl), privacy = clean(p.privacyUrl);\n    const footLinks = [];\n    if (terms) footLinks.push({ label: 'Termos de Uso', href: terms });\n    if (privacy) footLinks.push({ label: 'Política de Privacidade', href: privacy });\n    if (email) footLinks.push({ label: 'Suporte', href: email.includes('@') && !email.startsWith('http') ? 'mailto:' + email : email });\n    const stickyOn = (p.showMobileStickyCta ?? true) && isPhone;\n    const checkout = this.checkoutUrl();\n    return {\n      checkoutHref: checkout || '#oferta',\n      buying: s.buying, notBuying: !s.buying, buyAria: s.buying ? 'true' : 'false',\n      onBuy: e => {\n        if (!checkout) return;\n        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;\n        e.preventDefault();\n        if (this.state.buying) return;\n        try { window.fbq && window.fbq('track', 'InitiateCheckout', { value: 17.90, currency: 'BRL', content_name: 'Currículo Pro' }); } catch (_) {}\n        this.setState({ buying: true });\n        this.bt = setTimeout(() => this.setState({ buying: false }), 6000);\n        setTimeout(() => { window.location.href = checkout; }, 150);\n      },\n      heroCtaRef: this.heroCtaRef, offerRef: this.offerRef, trackRef: this.trackRef,\n      showBackSheet: !isPhone,\n      heroPlanePad: isPhone ? '28px 24px 0' : 'clamp(32px,4vw,52px) clamp(28px,4vw,52px)',\n      heroPlaneH: isPhone ? '380px' : 'auto',\n      heroSheetW: isPhone ? '330px' : '440px',\n      heroSheetMargin: isPhone ? '0 auto' : '0 auto 0 4%',\n      heroTagBottom: isPhone ? '120px' : '9%',\n      feedback: imgs.map((src, i) => ({ img: React.createElement('img', { src, alt: 'Exemplo ilustrativo ' + (i + 1) + ' de conversa sobre o Currículo Pro (não é depoimento real)', loading: i < 3 ? 'eager' : 'lazy', decoding: 'async', draggable: false, style: { display: 'block', width: '100%', height: '100%', objectFit: 'cover' } }) })),\n      autoCols: isPhone ? 'min(76vw,290px)' : wide ? 'calc((100% - 32px) / 3)' : '240px',\n      onTrackScroll: e => {\n        const t = e.currentTarget;\n        let i = Math.round(t.scrollLeft / this.step());\n        if (this.atEnd()) i = count - 1;\n        if (i !== this.state.idx) this.setState({ idx: i });\n      },\n      prev: () => { pause(); this.go(idx <= 0 ? count - 1 : idx - 1); },\n      next: () => { pause(); this.go(this.atEnd() ? 0 : idx + 1); },\n      pauseCar: pause, hoverOn: () => { this.carHover = true; }, hoverOff: () => { this.carHover = false; },\n      dots: imgs.map((_, i) => ({ active: i === idx, label: 'Ir para o exemplo ' + (i + 1), w: i === idx ? '26px' : '10px', bg: i === idx ? '#2563EB' : '#CDD2DA', go: () => { pause(); this.go(i); } })),\n      faqs: faqData.map(([q, a], i) => {\n        const open = s.open === i;\n        return { q, a, pid: 'faq-' + i, open, rot: open ? '45deg' : '0deg', ring: open ? '#2563EB' : '#D7DBE2', iconBg: open ? '#2563EB' : '#fff', iconFg: open ? '#fff' : '#111318', border: i === faqData.length - 1 ? '0' : '1px solid #EEF0F3', toggle: () => this.setState(st => ({ open: st.open === i ? -1 : i })) };\n      }),\n      footLinks, year: new Date().getFullYear(),\n      showSticky: stickyOn && !s.heroVis && !s.offerVis,\n      footPad: stickyOn ? 'calc(96px + env(safe-area-inset-bottom))' : '28px'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
